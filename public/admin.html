<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Luky · Administration</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #0c1226; color: #e8ecf8; margin: 0; padding: 24px; }
    main { max-width: 460px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p { color: #8d97bc; font-size: .9rem; margin: 0 0 20px; }
    label { display: block; font-weight: 700; font-size: .85rem; color: #8d97bc; margin: 14px 0 6px; }
    input, select, button { width: 100%; box-sizing: border-box; font: inherit; font-size: 1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid #27315a; background: #141b34; color: inherit; }
    button { background: #f46a2e; color: #1a0b04; font-weight: 800; border: 0; margin-top: 18px; cursor: pointer; }
    button:disabled { opacity: .6; }
    #out { margin-top: 20px; }
    .code { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #141b34; border: 1px solid #27315a; border-radius: 12px; padding: 10px 14px; margin-top: 8px; font-family: ui-monospace, monospace; font-size: 1.05rem; letter-spacing: .05em; }
    .code button { width: auto; margin: 0; padding: 6px 10px; font-size: .8rem; background: #27488f; color: #fff; }
    .err { color: #fca5a5; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Codes de validation Luky</h1>
    <p>Générez un code à envoyer au client après réception de son paiement. Chaque code ne sert qu’une fois.</p>
    <form id="f">
      <label for="secret">Mot de passe administrateur</label>
      <input id="secret" type="password" autocomplete="current-password" required>
      <label for="plan">Offre payée</label>
      <select id="plan">
        <option value="monthly">Mensuel (3 500 FCFA)</option>
        <option value="yearly">Annuel (30 000 FCFA)</option>
        <option value="lifetime">Licence à vie (95 000 FCFA)</option>
      </select>
      <label for="count">Nombre de codes</label>
      <input id="count" type="number" min="1" max="50" value="1">
      <button id="go" type="submit">Générer</button>
    </form>
    <div id="out" aria-live="polite"></div>
  </main>
  <script>
    const f = document.getElementById("f"), out = document.getElementById("out"), go = document.getElementById("go");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      out.textContent = ""; go.disabled = true;
      try {
        const r = await fetch("/api/admin/generate-code", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-secret": document.getElementById("secret").value },
          body: JSON.stringify({ plan: document.getElementById("plan").value, count: Number(document.getElementById("count").value) }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Erreur");
        j.codes.forEach((c) => {
          const row = document.createElement("div"); row.className = "code";
          const t = document.createElement("span"); t.textContent = c;
          const b = document.createElement("button"); b.type = "button"; b.textContent = "Copier";
          b.onclick = () => navigator.clipboard.writeText(c).then(() => (b.textContent = "Copié"));
          row.append(t, b); out.append(row);
        });
      } catch (err) {
        const p = document.createElement("div"); p.className = "err"; p.textContent = err.message; out.append(p);
      } finally { go.disabled = false; }
    });
  </script>
</body>
</html>
